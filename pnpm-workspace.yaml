packages:
  - 'apps/*'
  - 'solana'

# Optional native speed-ups pulled in by @solana/web3.js fall back to pure JavaScript, and
# esbuild (used by tsx in solana/) ships its binary as an optional dependency, so none of
# their install scripts need to run.
allowBuilds:
  '@reown/appkit': false
  bigint-buffer: false
  bufferutil: false
  esbuild: false
  utf-8-validate: false
