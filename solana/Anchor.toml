[toolchain]
anchor_version = "1.2.2"
solana_version = "3.1.10"
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

# Same program keypair (target/deploy/closeby_escrow-keypair.json) on both clusters.
[programs.localnet]
closeby_escrow = "4vaVcMbVh5czXPMw3w6FCp8AFjNNuVtaquppq6ZEzugT"

[programs.devnet]
closeby_escrow = "4vaVcMbVh5czXPMw3w6FCp8AFjNNuVtaquppq6ZEzugT"

[provider]
cluster = "localnet"
# Deploy keypair, outside the repo. Never commit it.
wallet = "~/.config/solana/id.json"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/*.ts"

[hooks]

[test]
startup_wait = 30000
shutdown_wait = 2000
upgradeable = true
